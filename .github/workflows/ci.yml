name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  docs:
    name: Markdown lint and link check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Markdown lint
        uses: DavidAnson/markdownlint-cli2-action@v24
        with:
          globs: "**/*.md"
      - name: Link check (internal links must resolve; external links are checked too)
        uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress --cookie-jar lychee-cookies.json --max-retries 3 --accept "200..=299,303,403,429,503,999" --exclude "^https://(www\.)?linkedin\.com" --exclude "^http://localhost" './**/*.md'
          fail: true

  health-check-tests:
    name: Health check tests (asleep vs down)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Lint and format check
        run: |
          ruff check .
          ruff format --check .
      - name: Tests (coverage gate 75% on the health check)
        run: python -m pytest -q --cov=scripts --cov-report=term-missing --cov-fail-under=75
      - name: Dependency audit
        run: pip-audit -r requirements-dev.txt
      - name: SBOM (CycloneDX)
        run: cyclonedx-py environment --output-format JSON --output-file sbom.json
      - uses: actions/upload-artifact@v7
        with:
          name: sbom
          path: sbom.json

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: gitleaks (full history)
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.24.2/gitleaks_8.24.2_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks git --redact --verbose --exit-code 1 .
